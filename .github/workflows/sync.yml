name: Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SRC_REPO }}
          token: ${{ secrets.SRC_TOKEN }}

      - continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - uses: actions/checkout@v4
        with:
          path: local

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Refresh
        env:
          APP_PASSPHRASE: ${{ secrets.APP_PASSPHRASE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          WATCHLIST_FILE: local/watchlist.enc.json
        # Output is redacted at the source (scripts/run.py::configure_redaction),
        # so it is safe to show here — and a failed run is debuggable.
        # Exit 1 means one source failed and the rest is still worth publishing;
        # only a hard failure (2) skips the publish step.
        run: |
          set +e
          python -m scripts.run
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -le 1 ]
        id: refresh

      - name: Publish
        if: steps.refresh.outputs.code == '0' || steps.refresh.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd data-branch
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "sync $(date -u +%s)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Report
        if: steps.refresh.outputs.code != '0'
        run: |
          echo "refresh exited ${{ steps.refresh.outputs.code }}"
          exit 1
